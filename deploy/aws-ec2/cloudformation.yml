AWSTemplateFormatVersion: '2010-09-09'
Description: Chatwoot on a private EC2 instance behind an existing Application Load Balancer

Parameters:
  Environment:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]*'
  SourceInfrastructurePrefix:
    Type: String
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]*'
  DomainName:
    Type: String
  PostgresDatabase:
    Type: String
    AllowedPattern: '[A-Za-z_][A-Za-z0-9_]*'
  PostgresUsername:
    Type: String
    AllowedPattern: '[A-Za-z_][A-Za-z0-9_]*'
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RdsEndpoint:
    Type: String
  RdsPort:
    Type: Number
    Default: 5432
  RdsMasterSecretArn:
    Type: String
    NoEcho: true
  RuntimeSecretArn:
    Type: String
    NoEcho: true
  HttpsListenerArn:
    Type: String
  ListenerRulePriority:
    Type: Number
  InstanceType:
    Type: String
    Default: t3.large
  RootVolumeSize:
    Type: Number
    Default: 80
    MinValue: 40
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ContainerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the latest 15 production images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 15
                },
                "action": { "type": "expire" }
              }
            ]
          }

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /chatwoot/${Environment}
      RetentionInDays: 30

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ChatwootRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt ContainerRepository.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref RuntimeSecretArn
                  - !Ref RdsMasterSecretArn
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/chatwoot/${Environment}/*
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${UploadsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt UploadsBucket.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApplicationLogGroup.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BuildChatwootImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${UploadsBucket.Arn}/deploy/source.zip
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApplicationLogGroup.Arn

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Build the customized Chatwoot production image
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 60
      Source:
        Type: S3
        Location: !Sub ${UploadsBucket}/deploy/source.zip
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - REGISTRY="${REPOSITORY_URI%%/*}"
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            build:
              commands:
                - docker build --build-arg GIT_SHA="$IMAGE_TAG" --file docker/Dockerfile --tag "$REPOSITORY_URI:$IMAGE_TAG" --tag "$REPOSITORY_URI:latest" .
            post_build:
              commands:
                - docker push "$REPOSITORY_URI:$IMAGE_TAG"
                - docker push "$REPOSITORY_URI:latest"
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Type: PLAINTEXT
            Value: !GetAtt ContainerRepository.RepositoryUri
          - Name: IMAGE_TAG
            Type: PLAINTEXT
            Value: latest
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ApplicationLogGroup
          StreamName: codebuild
      Tags:
        - Key: Name
          Value: !Sub chatwoot-${Environment}-image-build

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the existing ALB to reach Chatwoot
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Rails from the shared ALB
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub chatwoot-${Environment}

  RdsIngressFromChatwoot:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: PostgreSQL from Chatwoot
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref RdsPort
      ToPort: !Ref RdsPort
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup

  ApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker jq curl
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
          usermod -aG docker ec2-user
          install -d -m 700 /opt/chatwoot
      Tags:
        - Key: Name
          Value: !Sub chatwoot-${Environment}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub chatwoot-${Environment}-tg
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 20
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Targets:
        - Id: !Ref ApplicationInstance
          Port: 3000

  HttpsListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref DomainName
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  InstanceId:
    Value: !Ref ApplicationInstance
  EcrRepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  CodeBuildProjectName:
    Value: !Ref ImageBuildProject
  UploadsBucketName:
    Value: !Ref UploadsBucket
  LogGroupName:
    Value: !Ref ApplicationLogGroup
  TargetGroupArn:
    Value: !Ref TargetGroup
  DomainName:
    Value: !Ref DomainName
  RdsEndpoint:
    Value: !Ref RdsEndpoint
